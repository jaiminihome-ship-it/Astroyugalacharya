<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Connect | Pt. Yugal Acharya</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #050505;
      --gold-grad: linear-gradient(135deg, #BF953F, #FCF6BA, #B38728, #FBF5B7);
      --gold-accent: #BF953F;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      /* नक्षत्र ग्राफिक्स */
      background-image: radial-gradient(circle at 20% 30%, rgba(191, 149, 63, 0.15) 0%, transparent 50%);
      color: #ffffff;
      /* Dynamic Viewport Height: मोबाइल ब्राउज़र के लिए बेस्ट */
      min-height: 100dvh; 
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 10px; /* साइड पैडिंग कम की ताकि चौड़ा दिखे */
    }

    .container { 
      width: 100%; 
      max-width: 520px; /* थोड़ा और चौड़ा किया */
      text-align: center; 
    }

    /* रिस्पॉन्सिव रिंग: vmin का इस्तेमाल ताकि हमेशा आनुपातिक रहे */
    .profile-img-container {
      position: relative;
      width: 65vmin; 
      height: 65vmin;
      max-width: 280px; 
      max-height: 280px;
      margin: 0 auto 30px;
    }
    
    .profile-img-container::before {
        content: '';
        position: absolute;
        top: -10px; left: -10px; right: -10px; bottom: -10px;
        background: var(--gold-grad);
        border-radius: 50%;
        animation: spin 8s linear infinite;
        filter: blur(10px);
    }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    .profile-img {
      width: 100%; height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: top center; /* चेहरा ऊपर से न कटे */
      border: 6px solid var(--bg-dark);
      position: relative;
      z-index: 1;
      box-shadow: 0 0 25px rgba(191, 149, 63, 0.4);
    }

    /* फॉन्ट साइज़ को 'Aggressive' बनाया गया */
    .user-name {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(28px, 10vw, 42px);
      background: var(--gold-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .hero-btn {
      display: flex; align-items: center; justify-content: center; gap: 12px;
      width: 95%; margin: 0 auto 35px; padding: 22px;
      background: var(--gold-grad); color: #050505;
      text-decoration: none; border-radius: 18px;
      font-weight: 800; font-size: 20px;
      box-shadow: 0 12px 30px rgba(191, 149, 63, 0.4);
    }

    .links-grid { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 15px; 
      width: 100%;
      padding: 0 5px;
    }

    .link-card {
      background: rgba(25, 25, 25, 0.85);
      border: 1px solid rgba(191, 149, 63, 0.3);
      padding: 25px 10px; /* बटन की ऊंचाई बढ़ाई */
      border-radius: 20px;
      text-decoration: none;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      transition: transform 0.2s;
    }
    
    .link-card:active { transform: scale(0.95); }

    .card-icon { font-size: 32px; color: var(--gold-accent); }
    .card-title { font-size: 15px; font-weight: 600; }

    .footer { margin-top: auto; padding-top: 40px; opacity: 0.6; font-size: 13px; letter-spacing: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-img-container">
      <img src="https://i.ibb.co/99zpfNsD/Gemini-Generated-Image-odxur1odxur1odxu.png" class="profile-img">
    </div>
    
    <h1 class="user-name">पं. युगल आचार्य</h1>
    <p style="color:#FCF6BA; margin-bottom: 40px; font-size: 17px;">वैदिक ज्योतिष • वास्तु • कर्मकांड विशेषज्ञ</p>

    <a href="https://api.whatsapp.com/send/?phone=919928139485" class="hero-btn">
      <i class="fab fa-whatsapp"></i> सीधा संपर्क करें (Book Now)
    </a>

    <div class="links-grid">
      <a href="https://www.youtube.com/@AstroTVJaipur" class="link-card"><i class="fab fa-youtube card-icon"></i><span class="card-title">YouTube</span></a>
      <a href="https://Astroyugalacharya.in" class="link-card"><i class="fas fa-globe card-icon"></i><span class="card-title">वेबसाइट</span></a>
      <a href="https://www.instagram.com/yugalaacharya" class="link-card"><i class="fab fa-instagram card-icon"></i><span class="card-title">Instagram</span></a>
      <a href="https://www.facebook.com/yugal.sharma.583" class="link-card"><i class="fab fa-facebook-f card-icon"></i><span class="card-title">Facebook</span></a>
      <a href="https://share.google/oQ3ktVvgQcR6gK0nY" class="link-card"><i class="fab fa-google card-icon"></i><span class="card-title">G. प्रोफाइल</span></a>
      <a href="https://www.google.com/maps/place/Astrologer+Yugal+acharya/@26.9060564,75.7428486,17z/data=!3m1!4b1!4m6!3m5!1s0x396db569ff12f825:0xf679324f5e3cc21b!8m2!3d26.9060516!4d75.7454235!16s%2Fg%2F11h0lkx004?entry=ttu&g_ep=EgoyMDI2MDIwMS4wIKXMDSoASAFQAw%3D%3D" class="link-card"><i class="fas fa-map-marker-alt card-icon"></i><span class="card-title">लोकेशन</span></a>
    </div>
    
    <div class="footer">॥ शुभम् भवतु ॥</div>
  </div>
</body>
</html>
